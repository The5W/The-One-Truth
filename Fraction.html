<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Upgraded Background</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body {
            background-color: #030504; /* Sangat gelap, hampir hitam murni */
            overflow: hidden;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif; /* Hanya untuk berjaga-jaga */
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Efek Vignette untuk menggelapkan sudut-sudut layar */
        .vignette-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 10%, #030504 120%);
            z-index: 2;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>
    <div class="vignette-overlay"></div>

    <script>
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        
        // Menambahkan sedikit kabut (fog) agar objek yang jauh perlahan menghilang ke kegelapan
        scene.fog = new THREE.FogExp2(0x030504, 0.005);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 120;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimasi performa
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        // Menggunakan AdditiveBlending untuk efek "Glow/Hologram"
        
        // Garis Kawat Emas Bercahaya
        const lineMatGold = new THREE.LineBasicMaterial({ 
            color: 0xfbbf24, 
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending 
        });
        
        // Garis Kawat Teal (Hijau Kebiruan) Bercahaya
        const lineMatTeal = new THREE.LineBasicMaterial({ 
            color: 0x34d399, 
            transparent: true, 
            opacity: 0.7,
            blending: THREE.AdditiveBlending 
        });

        // Permukaan Kaca Gelap (Glass Solid)
        const glassMatDark = new THREE.MeshBasicMaterial({
            color: 0x064e3b, // Hijau sangat gelap
            transparent: true,
            opacity: 0.08, // Sangat tipis transparan
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });

        for (let i = 0; i < 150; i++) {
            // Membuat dimensi acak yang ekstrem (seperti balok pilar panjang atau pelat tipis lebar)
            const width = Math.random() > 0.7 ? Math.random() * 100 + 20 : Math.random() * 15 + 2;
            const height = Math.random() > 0.7 ? Math.random() * 100 + 20 : Math.random() * 15 + 2;
            const depth = Math.random() > 0.7 ? Math.random() * 100 + 20 : Math.random() * 15 + 2;
            
            const geometry = new THREE.BoxGeometry(width, height, depth);
            
            // 1. Buat Mesh solid (permukaan kaca)
            const boxMesh = new THREE.Mesh(geometry, glassMatDark);
            
            // 2. Buat kerangka kawat (garis tepi)
            const edges = new THREE.EdgesGeometry(geometry);
            const randColor = Math.random();
            const lineMaterial = randColor > 0.8 ? lineMatGold : (randColor > 0.3 ? lineMatTeal : lineMatGold);
            // Reduksi opacity kawat standar untuk kontras
            if(randColor <= 0.3) lineMaterial.opacity = 0.2; 
            
            const boxLines = new THREE.LineSegments(edges, lineMaterial);
            
            // Gabungkan garis ke dalam Mesh kaca
            boxMesh.add(boxLines);
            
            // Posisi acak memusat
            boxMesh.position.x = (Math.random() - 0.5) * 120; 
            boxMesh.position.y = (Math.random() - 0.5) * 120;
            boxMesh.position.z = (Math.random() - 0.5) * 120;

            // Rotasi sudut presisi 90 derajat (Architectural blueprint feel)
            boxMesh.rotation.x = (Math.floor(Math.random() * 4) * Math.PI) / 2;
            boxMesh.rotation.y = (Math.floor(Math.random() * 4) * Math.PI) / 2;
            boxMesh.rotation.z = (Math.floor(Math.random() * 4) * Math.PI) / 2;

            group.add(boxMesh);
        }

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 3000;
        const posArray = new Float32Array(particlesCount * 3);
        
        for(let i = 0; i < particlesCount * 3; i++) {
            // Menyebarkan partikel dalam radius yang luas
            posArray[i] = (Math.random() - 0.5) * 400;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.5,
            color: 0x4fa980,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        let mouseX = 0;
        let mouseY = 0;
        const target = new THREE.Vector2();
        
        // Membaca gerakan mouse
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.0008;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.0008;
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotasi grup utama (arsitektur)
            group.rotation.y += 0.001;
            group.rotation.x += 0.0005;
            
            // Rotasi awan partikel berlawanan arah dengan lambat
            particlesMesh.rotation.y = -elapsedTime * 0.02;
            particlesMesh.rotation.x = elapsedTime * 0.01;

            // Efek paralaks kamera yang super mulus
            target.x = mouseX * 35;
            target.y = mouseY * 35;
            
            camera.position.x += (target.x - camera.position.x) * 0.02;
            camera.position.y += (-target.y - camera.position.y) * 0.02;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        // Penyesuaian ukuran layar otomatis
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Mulai animasi
        animate();
    </script>
</body>
</html>
